# Leaf coverage gate.
#
# The solidity gate proves nothing shows through the opaque canopy mass. This
# gate proves the rendered leaf cards cover the exposed crown surface.
#
# Generation first performs deterministic global max-cover selection. Every
# exposed candidate must have a direction-compatible selected cluster within its
# conservative coverage radius. That radius is derived from the selected card's
# actual randomized rendered width, not from the preset's average card size.
#
# QA then performs two independent checks:
#
# 1. An offset Fibonacci probe set measures the rendered result without replaying
#    the generator candidate set.
# 2. Adaptive icosphere subdivision certifies every potentially exposed surface
#    patch. A patch passes only when one direction-compatible card covers the
#    whole patch after adding conservative world-space and normal uncertainty.
#    Patches that cannot be proven hidden or covered are subdivided.
#
# Continuous coverage is expressed as distance divided by each card's effective
# coverage radius. A value at or below 1 means the complete patch lies inside the
# same conservative radius used by generation.

run:
  seedCount: 24
  firstSeed: 90001
  seedStep: 7919

probe:
  probeDensityMultiplier: 2
  probeExposureMargin: 0.05
  continuous:
    maximumCoverageRatio: 1.0
    maximumSubdivisionDepth: 8
    minimumDirectionDiameter: 0.004
    exposureMargin: 0.05
    normalUncertaintyScale: 1
    minimumCoverageNormalDot: 0.2588
    maximumFailureExamples: 12

thresholds:
  roundOrchard:
    maximumCandidateCoverageRatio: 1.000001
    gapCardRatio: 0.85
    minimumLeafAreaIndex: 6.5
    bareExposedLobes: 0
