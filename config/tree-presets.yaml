  # The glade family. Few large soft lobes rather than many small ones, a wide
  # value range from near-cream tops to teal undersides, and the `puff` card,
  # whose guaranteed opaque disc is over three times a leaf spray's. That disc
  # is what lets the covering hold at a third of the candidates the spray
  # presets need: coverage is carried by the card itself instead of by finding
  # enough of them.
  # Seven puffs rather than ten. Counting scallops around a crown in the
  # reference gets five to seven, and the difference is not subtle: ten lobes at
  # this radius read as a bumpy sphere, seven read as a handful of clouds pushed
  # together. The scale multiplier grows to keep the crown the same volume, so
  # the silhouette gets bolder without the tree getting smaller.
  gladeCanopy:
    label: Glade canopy
    height: 7.4
    crown:
      profile: round
      baseHeight: 2.4
      height: 4.6
      radius: 3.0
      lobeCount: 7
      lobeScale: [0.86, 1.08]
      verticalScale: [0.84, 1.04]
