        protrusionRatio: 0.2
        leavesPerCluster: 5
        colorLift: 0.1
        colorJitter: 0.04
        roughness: 0.92
        layerCount: 1
        layerOffsetRatio: 0.16
      shell:
        # Candidates are drawn per lobe, so dropping three lobes would have
        # thinned the same surface by a third. The count rises to keep the
        # crown's total candidate set where the covering was solved for.
        candidatesPerLobe: 640
        # At or below twice the puff's guaranteed radius ratio, so the greedy's
