scene:
  backgroundColor: '#cfe3ea'
  fogColor: '#cfe3ea'
  fogNear: 24
  fogFar: 62
  groundColor: '#8aa860'
  groundSize: 72
  # The pool of ambient shade under every crown. Not the sun's shadow, which the
  # shadow map draws: this is what stops a tree from reading as hovering.
  contactShadow:
    enabled: true
    radiusScale: 1.12
    strength: 0.42
  # Broad patches where the meadow is a shade paler and warmer, baked into the
  # ground's own vertices so a flat disc reads as light pooling on grass.
  lightPools:
    enabled: true
    cellSize: 9
    amplitude: 0.06
    warmth: 0.55
  # A carpet of tufts and flower sprigs, so the ground has the same texture as
  # the canopy and something for the lens to dissolve in the foreground.
  meadow:
    enabled: true
    count: 3600
    radius: 26
    flowerShare: 0.3

camera:
  fieldOfView: 42
  near: 0.1
  far: 120
  position: [12, 8, 16]
  target: [0, 4.1, 0]

renderer:
  maxPixelRatio: 2
  shadowMapSize: 2048
  # The lens. A narrow sharp band around whatever is being looked at, with the
  # foreground melting fast and the tree line melting slowly, is what makes the
  # scene read as a diorama rather than as a landscape.
  depthOfField:
    enabled: true
    focusRange: 4.5
    nearFalloff: 5
    farFalloff: 26
    blurRadius: 0.011
    walkFocus: 15

lod:
  nearPixels: 300
  mediumPixels: 78
  farPixels: 35
  cullPixels: 12
  hysteresis: 0.12
  fadeBand: 0.15
  shadowPixels: 90
  generationBudgetMs: 8

lighting:
  # A storybook canopy is lit by a warm low sun against a strong cool sky, so
  # the shadows stay luminous and shift toward blue instead of going black.
  hemisphereSkyColor: '#dcecff'
  hemisphereGroundColor: '#7f9058'
  hemisphereIntensity: 2.1
  sunColor: '#ffe7bd'
  sunIntensity: 2.35
  sunPosition: [14, 12, 7]

