name: Procedural Tree Shape QA

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tree-shape-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shape-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source and unit tests
        run: npm run check

      - name: Run desktop and mobile WebGL render smoke
        run: npm run qa:render

      - name: Upload unified canopy render evidence
        if: always() && hashFiles('qa-results/render-smoke/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: unified-canopy-render-smoke
          path: qa-results/render-smoke
          if-no-files-found: error

      - name: Run deterministic shape QA
        run: npm run qa:shape

      - name: Upload QA report
        if: always() && hashFiles('qa-results/tree-shape/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: unified-canopy-tree-shape-qa-report
          path: qa-results/tree-shape
          if-no-files-found: error
