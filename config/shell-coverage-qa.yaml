# Leaf coverage gate.
#
# Generation uses the configured packing radius only as a broad spatial limit.
# A candidate is covered only when its surface point maps to an opaque texel in
# at least one rendered card plane after card orientation and linear texture
# filtering are applied.
#
# QA then performs two independent checks:
#
# 1. An offset Fibonacci probe set measures centre spacing and leaf area without
#    replaying the generator candidate set.
# 2. Adaptive icosphere subdivision certifies every potentially exposed surface
#    patch. Whole patches are accepted only inside the alpha mask's guaranteed
#    opaque centre disk. Individual samples outside that disk are checked against
#    the complete filtered alpha silhouette of every compatible nearby cluster.
#
# This keeps the proof tied to the pixels rendered by the material rather than
# treating the transparent parts of a quad as foliage.

run:
  seedCount: 24
  firstSeed: 90001
  seedStep: 7919

probe:
  probeDensityMultiplier: 2
  probeExposureMargin: 0.05
  continuous:
    maximumCoverageRatio: 1.0
    maximumSubdivisionDepth: 8
    minimumDirectionDiameter: 0.004
    exposureMargin: 0.05
    normalUncertaintyScale: 1
    minimumCoverageNormalDot: 0.2588
    maximumFailureExamples: 12

thresholds:
