name: Procedural Tree Shape QA

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tree-shape-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shape-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production tree pipeline
        run: npm run verify

      - name: Upload QA evidence
        if: always() && hashFiles('qa-results/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: procedural-tree-qa
          path: qa-results
          if-no-files-found: error
