# Leaf placement coverage gate.
#
# The solidity gate renders the alpha-cut foliage and proves the canopy does not
# show sky through the final material. This gate independently proves that the
# shell card footprints cover the exposed crown surface without placement-scale
# gaps. Keeping those responsibilities separate avoids pretending that a scalar
# radius describes every hole in a detailed leaf silhouette.
#
# Generation first performs deterministic global max-cover selection. Every
# exposed candidate must have a direction-compatible selected cluster within its
# effective packing radius. When a preset requests a radius beyond the safe quad
# inradius, generation expands only the shell geometry so the physical radius
# remains at or below 0.49 of the actual rendered card width.
#
# QA then performs three independent checks:
#
# 1. The physical coverage ratio never exceeds the rendered quad bound.
# 2. An offset Fibonacci probe set measures the rendered placement without
#    replaying the generator candidate set.
# 3. Adaptive icosphere subdivision certifies every potentially exposed surface
#    patch. A patch passes only when one direction-compatible card footprint
#    covers the whole patch after adding conservative world-space and normal
#    uncertainty. Patches that cannot be proven hidden or covered are subdivided.
#
# Continuous coverage is expressed as distance divided by each card's effective
# coverage radius. A value at or below 1 means the complete patch lies inside the
# same physically bounded radius used by generation.

run:
  seedCount: 24
  firstSeed: 90001
  seedStep: 7919

probe:
  probeDensityMultiplier: 2
  probeExposureMargin: 0.05
  continuous:
    maximumCoverageRatio: 1.0
    maximumSubdivisionDepth: 8
    minimumDirectionDiameter: 0.004
    exposureMargin: 0.05
    normalUncertaintyScale: 1
    minimumCoverageNormalDot: 0.2588
    maximumFailureExamples: 12

thresholds:
  roundOrchard:
    maximumCandidateCoverageRatio: 1.000001
    gapCardRatio: 0.85
    minimumLeafAreaIndex: 6.5
    bareExposedLobes: 0
