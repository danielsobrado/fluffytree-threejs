  # Bonsai presets differ from the orchard families only in configuration: a
  # trunk style with real movement, a hard taper, a pronounced nebari, and a low
  # wide pad crown made of flattened lobes. Every foliage and solidity gate
  # covers them exactly as it covers the trees above.
  bonsaiInformal:
    label: Bonsai informal upright
    height: 3.95
    crown:
      profile: pad
      baseHeight: 1.92
      height: 1.78
      radius: 1.95
      lobeCount: 16
      lobeScale: [0.78, 1.0]
      verticalScale: [0.44, 0.62]
      radialBias: 0.62
      asymmetry: 0.18
      lean: [0.16, -0.06]
      surfaceTension: 0.68
      lobeScaleMultiplier: 1.3
      scaleVariation: 0.07
      clumps:
        macroCount: 6
        subClumpCount: [2, 3]
        separation: 0.48
        anchoring: 0.7
        silhouetteBreakup: 0.2
    trunk:
      style: informalUpright
      movement: 0.95
      curveCount: 2.2
      sweep: 0.45
      # A heavy nebari is the point of the style, and it is load bearing here:
      # trimming the flare opens a see-through window between the trunk and its
      # lowest limbs that the solidity gate counts.
