      clumps:
        macroCount: 6
        subClumpCount: [2, 3]
        separation: 0.48
        anchoring: 0.7
        silhouetteBreakup: 0.2
    trunk:
      style: informalUpright
      movement: 0.95
      curveCount: 2.2
      sweep: 0.45
      # A heavy nebari is the point of the style, and it is load bearing here:
      # trimming the flare opens a see-through window between the trunk and its
