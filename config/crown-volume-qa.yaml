run:
  seedStart: 1
  seedCount: 16
  deterministicReplayCount: 2

thresholds:
  minimumUniqueHashRate: 1
  exact:
    componentCount: 1
    boundaryEdgeCount: 0
    nonManifoldEdgeCount: 0
    nonFiniteValueCount: 0
  ranges:
    triangleCount: [1000, 50000]
    maximumNormalLengthError: [0, 0.0001]
    maximumCoincidentNormalDelta: [0, 0.0001]
    maximumEdgeLengthRatio: [0, 1.9]

report:
  metrics:
    - triangleCount
    - vertexCount
    - uniqueVertexCount
    - componentCount
    - boundaryEdgeCount
    - nonManifoldEdgeCount
    - maximumNormalLengthError
    - maximumCoincidentNormalDelta
    - maximumEdgeLengthRatio
