# Leaf coverage gate.
#
# The solidity gate proves nothing shows *through* the canopy. This gate proves
# the leaf cards actually reach the whole exposed crown surface, which is a
# different failure: opaque cores with bald patches still score zero holes.
#
# For every seeded tree an independent Fibonacci probe set is laid over each
# lobe, twice as dense as the candidates the generator chose from and offset by
# an unrelated phase. Each exposed probe is measured to the nearest leaf cluster
# that faces the same way it does.
#
#   gapCardRatio      maximum probe-to-cluster distance / the median rendered card width
#   leafAreaIndex     total card area / exposed crown area
#   bareExposedLobes  lobes with exposed surface and no cluster at all
#
# gapCardRatio is the metric that means something physically: below 1 the cards
# at the worst point on the crown are still wider than the gap between them. The
# limit is calibrated against the rendered result rather than derived. For scale,
# the previous per-lobe selector measured 2.2 on columnar.
#
# leafAreaIndex is what makes one preset read as denser foliage than another. It
# does not follow from the gap metrics: a crown can be evenly covered and still
# look thin if its cards are small for its surface. Columnar measured 4.83 here
# while the other two sat above 7, which is exactly the density difference that
# was visible on the deployed site.
#
# The three gated metrics are independent: a crown can be evenly covered and
# still look thin, be dense on average and still have one bald lobe, or have
# every lobe populated and still show a hole between two of them.
#
# This is a sampled bound, not a continuous proof: distance to the nearest
# cluster is 1-Lipschitz, so a point between probes can exceed the reported gap
# by at most the probe spacing.

run:
  seedCount: 24
  firstSeed: 90001
  seedStep: 7919

probe:
  probeDensityMultiplier: 2
  probeExposureMargin: 0.05

thresholds:
  roundOrchard:
    gapCardRatio: 0.85
    minimumLeafAreaIndex: 6.5
    bareExposedLobes: 0
  columnar:
    gapCardRatio: 0.85
    minimumLeafAreaIndex: 6.5
    bareExposedLobes: 0
  irregularAutumn:
    gapCardRatio: 0.85
    minimumLeafAreaIndex: 6.5
    bareExposedLobes: 0
  roundBush:
    gapCardRatio: 0.85
    minimumLeafAreaIndex: 6.5
    bareExposedLobes: 0
  autumnBush:
    gapCardRatio: 0.85
    minimumLeafAreaIndex: 6.5
    bareExposedLobes: 0

report:
  maxFailures: 6
