name: One-shot repository verification

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify:
    if: github.event.issue.pull_request && github.event.comment.body == '/verify-phase-2-5'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verification battery
        id: verify
        shell: bash
        run: |
          set +e
          npm run check > check.log 2>&1
          check_status=$?
          npm run qa:render > render.log 2>&1
          render_status=$?
          npm run qa:shape > shape.log 2>&1
          shape_status=$?
          echo "check_status=${check_status}" >> "${GITHUB_OUTPUT}"
          echo "render_status=${render_status}" >> "${GITHUB_OUTPUT}"
          echo "shape_status=${shape_status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-2-5-one-shot-verification
          path: |
            check.log
            render.log
            shape.log
            qa-results/render-smoke
            qa-results/tree-shape
          if-no-files-found: warn

      - name: Report verification result
        if: always()
        uses: actions/github-script@v8
        env:
          CHECK_STATUS: ${{ steps.verify.outputs.check_status }}
          RENDER_STATUS: ${{ steps.verify.outputs.render_status }}
          SHAPE_STATUS: ${{ steps.verify.outputs.shape_status }}
        with:
          script: |
            const fs = require('fs');
            const tail = (path, limit = 6000) => {
              if (!fs.existsSync(path)) return '(log unavailable)';
              const value = fs.readFileSync(path, 'utf8');
              return value.slice(-limit);
            };
            const status = (value) => value === '0' ? 'PASS' : 'FAIL';
            const body = [
              '## Phase 2.5 verification',
              '',
              `- Source checks and unit tests: **${status(process.env.CHECK_STATUS)}**`,
              `- Desktop/mobile WebGL render smoke: **${status(process.env.RENDER_STATUS)}**`,
              `- 6,144-tree deterministic QA: **${status(process.env.SHAPE_STATUS)}**`,
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '<details><summary>check.log tail</summary>',
              '',
              '```text', tail('check.log'), '```',
              '</details>',
              '',
              '<details><summary>render.log tail</summary>',
              '',
              '```text', tail('render.log'), '```',
              '</details>',
              '',
              '<details><summary>shape.log tail</summary>',
              '',
              '```text', tail('shape.log'), '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
