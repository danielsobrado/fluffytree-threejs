# Screen-space solidity gate.
#
# Each demo tree is rendered alone against a transparent background at LOD0,
# LOD1, LOD2, LOD3, and at the three complementary transition midpoints.
# Background pixels that cannot reach the image border are places where the
# camera looks straight through the tree. Only openings wide enough to contain
# the configured hole radius are counted, so single-pixel dither stipple is
# ignored while a visible window is not.
#
#   holeRatio          counted enclosed background / filled silhouette
#   largestHoleRatio   largest counted opening / filled silhouette
#   coverageRatio      rendered pixels / framed image
#   coverageRetention  coverage at this LOD state / coverage at LOD0
#
# The same crown frame is reused for every LOD state. This makes coverage
# retention fail when a reduced representation becomes visibly thinner even if
# it remains technically closed. The base group remains an LOD0 render because
# the exact stem manifold gate validates every generated trunk LOD directly.

thresholds:
  roundOrchard:
    minimumWindMovedRatio: 0.15
    crown:
      holeRatio: 0.003
      largestHoleRatio: 0.002
      coverageRatio: 0.04
      coverageRetention: 0.8
    base:
      holeRatio: 0.001
      largestHoleRatio: 0.001
      coverageRatio: 0.04
