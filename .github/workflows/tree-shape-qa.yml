name: Procedural Tree Shape QA

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shape-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run deterministic shape QA
        run: npm run qa:shape

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tree-shape-qa-report
          path: qa-results/tree-shape
          if-no-files-found: error
